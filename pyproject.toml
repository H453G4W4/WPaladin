[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-sentinel"
version = "0.1.0"
description = "Non-destructive, authorization-gated WordPress security auditor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WP-Sentinel contributors" }]
keywords = ["wordpress", "security", "audit", "scanner", "defensive-security"]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.scripts]
wp-sentinel = "wp_sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["wp_sentinel*"]

[tool.setuptools.package-data]
"wp_sentinel.api" = ["dashboard.html"]
"wp_sentinel.intel" = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
